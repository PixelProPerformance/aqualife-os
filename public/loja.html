<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("aq_theme")||"light");}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loja — Aqualife</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
.sec{padding:28px 0 48px}
.loja-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.loja-hero h1{font-size:26px;color:var(--tinta)}
.loja-hero p{color:var(--suave);font-size:14.5px;margin-top:4px}
.btn-cart{position:relative;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;
  background:var(--agua);color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer}
.btn-cart .badge{background:#fff;color:var(--agua-esc);border-radius:999px;font-size:12px;font-weight:700;
  min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.filtro{font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;border:1px solid var(--linha);background:var(--branco);color:var(--corpo);transition:.15s}
.filtro:hover{border-color:var(--agua)}
.filtro.on{background:var(--agua);border-color:var(--agua);color:#fff}
.grid-loja{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.prod{background:var(--branco);border:1px solid var(--linha);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.prod:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(18,51,63,.10)}
.prod-img{aspect-ratio:1/1;background:var(--papel);position:relative;overflow:hidden}
.prod-img img{width:100%;height:100%;object-fit:cover;display:block}
.prod-img .sem{display:flex;align-items:center;justify-content:center;height:100%;color:var(--suave);font-size:13px}
.prod-dest{position:absolute;top:9px;left:9px;background:var(--areia,#C9A227);color:#3a2c07;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.03em}
.prod-b{padding:13px 14px 15px;display:flex;flex-direction:column;gap:3px;flex:1}
.prod-marca{font-size:11px;color:var(--suave);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.prod-nome{font-size:14.5px;font-weight:600;color:var(--tinta);line-height:1.3}
.prod-preco{margin-top:auto;padding-top:8px;font-size:12px;color:var(--suave)}
.prod-preco b{font-size:17px;color:var(--agua-esc);font-weight:700}
.prod-esg{font-size:11px;font-weight:700;color:var(--critico);margin-top:4px}
.vazio-loja{text-align:center;color:var(--suave);padding:60px 0}
/* modal detalhe */
.pm{position:fixed;inset:0;background:rgba(18,51,63,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:70}
.pm.on{display:flex}
.pm-cx{background:var(--branco);border-radius:16px;max-width:820px;width:100%;max-height:92vh;overflow:auto}
.pm-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
@media(max-width:680px){.pm-grid{grid-template-columns:1fr}}
.pm-fotos{background:var(--papel);padding:18px}
.pm-foto-main{aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--branco);border:1px solid var(--linha)}
.pm-foto-main img{width:100%;height:100%;object-fit:cover}
.pm-foto-main .sem{display:flex;align-items:center;justify-content:center;height:100%;color:var(--suave)}
.pm-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pm-thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:2px solid var(--linha);cursor:pointer}
.pm-thumbs img.on{border-color:var(--agua)}
.pm-info{padding:22px 24px}
.pm-marca{font-size:12px;color:var(--suave);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.pm-nome{font-size:22px;color:var(--tinta);margin:2px 0 8px}
.pm-desc{font-size:14px;color:var(--corpo);line-height:1.6;margin-bottom:16px;white-space:pre-line}
.pm-var{border:1px solid var(--linha);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:.15s}
.pm-var:hover{border-color:var(--agua)}
.pm-var.on{border-color:var(--agua);background:var(--agua-clr)}
.pm-var.esg{opacity:.5;cursor:not-allowed}
.pm-var-nome{font-size:14px;font-weight:600;color:var(--tinta)}
.pm-var-est{font-size:11.5px;color:var(--suave)}
.pm-var-preco{font-size:16px;font-weight:700;color:var(--agua-esc);white-space:nowrap}
.pm-var-preco s{font-size:12px;color:var(--suave);font-weight:400;margin-right:5px}
.pm-add{display:flex;gap:10px;align-items:center;margin-top:16px}
.qtd{display:inline-flex;align-items:center;border:1px solid var(--linha);border-radius:9px;overflow:hidden}
.qtd button{width:34px;height:40px;border:none;background:var(--papel);color:var(--tinta);font-size:18px;cursor:pointer}
.qtd input{width:44px;height:40px;border:none;text-align:center;font-size:15px;font-family:inherit;color:var(--tinta);background:var(--branco)}
.btn-add{flex:1;padding:12px;border-radius:10px;border:none;background:var(--agua);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.btn-add:disabled{background:var(--linha);color:var(--suave);cursor:not-allowed}
.pm-x{position:sticky;top:0;display:flex;justify-content:flex-end;padding:10px 12px 0;z-index:2}
.pm-x button{background:var(--papel);border:1px solid var(--linha);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px;color:var(--tinta)}
/* carrinho (gaveta) */
.drawer-bg{position:fixed;inset:0;background:rgba(18,51,63,.5);display:none;z-index:80}
.drawer-bg.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:420px;max-width:92vw;background:var(--branco);z-index:81;
  transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.drawer.on{transform:translateX(0)}
.drawer-h{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--linha)}
.drawer-h h3{font-size:18px;color:var(--tinta)}
.drawer-h button{background:none;border:none;font-size:20px;cursor:pointer;color:var(--suave)}
.drawer-body{flex:1;overflow:auto;padding:16px 20px}
.ci{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--linha)}
.ci img{width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--linha);background:var(--papel)}
.ci-info{flex:1;min-width:0}
.ci-nome{font-size:13.5px;font-weight:600;color:var(--tinta);line-height:1.3}
.ci-var{font-size:12px;color:var(--suave)}
.ci-preco{font-size:13.5px;font-weight:700;color:var(--agua-esc);margin-top:2px}
.ci-rm{font-size:11.5px;color:var(--critico);cursor:pointer;background:none;border:none;padding:0;margin-top:4px}
.ci .qtd{transform:scale(.85);transform-origin:right}
.carrinho-vazio{text-align:center;color:var(--suave);padding:40px 10px}
.frete-box{margin-top:16px;border-top:1px solid var(--linha);padding-top:16px}
.frete-cep{display:flex;gap:8px}
.frete-cep input{flex:1;padding:10px 12px;border:1px solid var(--linha);border-radius:9px;font-family:inherit;font-size:14px}
.frete-cep button{padding:10px 14px;border-radius:9px;border:1px solid var(--agua);background:var(--branco);color:var(--agua-esc);font-weight:600;cursor:pointer;font-size:13.5px}
.frete-op{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--linha);border-radius:9px;padding:10px 12px;margin-top:8px;cursor:pointer;font-size:13.5px}
.frete-op.on{border-color:var(--agua);background:var(--agua-clr)}
.frete-op .p{font-weight:700;color:var(--agua-esc)}
.drawer-f{border-top:1px solid var(--linha);padding:16px 20px;background:var(--papel)}
.tot-linha{display:flex;justify-content:space-between;font-size:13.5px;color:var(--corpo);margin-bottom:5px}
.tot-linha.total{font-size:18px;font-weight:700;color:var(--tinta);margin-top:8px}
.btn-checkout{width:100%;margin-top:12px;padding:13px;border-radius:10px;border:none;background:var(--agua-esc);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.btn-checkout:disabled{background:var(--linha);color:var(--suave);cursor:not-allowed}
.aviso-fase{font-size:11.5px;color:var(--suave);text-align:center;margin-top:8px}
.msg{font-size:12.5px;margin-top:8px}
.msg.err{color:var(--critico)}
</style>
</head>
<body>

<header class="topo">
  <div class="wrap topo-in">
    <div class="marca"><a href="/"><img src="/images/logo-azul.png" alt="Aqualife" style="height:36px;display:block" onerror="this.outerHTML='<div class=\'marca-i\'>A</div>'"></a></div>
    <nav class="nav"><a href="/loja.html" class="ativo">Loja</a><a href="/dashboard.html">Minha conta</a></nav>
  </div>
</header>

<main class="wrap sec">
  <div class="loja-hero">
    <div>
      <h1>Loja Aqualife</h1>
      <p>Produtos selecionados para o seu aquário. Entrega para todo o Brasil.</p>
    </div>
    <button class="btn-cart" id="btnCart">🛒 Carrinho <span class="badge" id="cartBadge">0</span></button>
  </div>

  <div class="filtros" id="filtros"></div>
  <div id="grade" class="grid-loja"><div class="vazio-loja">Carregando produtos…</div></div>
</main>

<!-- modal detalhe do produto -->
<div class="pm" id="pm"><div class="pm-cx">
  <div class="pm-x"><button onclick="fecharProd()" aria-label="Fechar">✕</button></div>
  <div class="pm-grid">
    <div class="pm-fotos">
      <div class="pm-foto-main" id="pmMain"><div class="sem">sem foto</div></div>
      <div class="pm-thumbs" id="pmThumbs"></div>
    </div>
    <div class="pm-info">
      <div class="pm-marca" id="pmMarca"></div>
      <h2 class="pm-nome" id="pmNome">—</h2>
      <div class="pm-desc" id="pmDesc"></div>
      <div id="pmVars"></div>
      <div class="pm-add">
        <div class="qtd"><button type="button" id="qMinus">−</button><input id="qInput" type="number" min="1" value="1"><button type="button" id="qPlus">+</button></div>
        <button class="btn-add" id="btnAdd">Adicionar ao carrinho</button>
      </div>
      <div class="msg" id="pmMsg"></div>
    </div>
  </div>
</div></div>

<!-- carrinho -->
<div class="drawer-bg" id="drawerBg" onclick="fecharCart()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-h"><h3>Seu carrinho</h3><button onclick="fecharCart()">✕</button></div>
  <div class="drawer-body" id="cartBody"><div class="carrinho-vazio">Carregando…</div></div>
  <div class="drawer-f" id="cartFooter" hidden>
    <div class="tot-linha"><span>Subtotal</span><span id="tSub">—</span></div>
    <div class="tot-linha"><span>Frete</span><span id="tFrete">—</span></div>
    <div class="tot-linha total"><span>Total</span><span id="tTotal">—</span></div>
    <button class="btn-checkout" id="btnCheckout" disabled>Finalizar compra</button>
    <div class="aviso-fase">O pagamento entra na próxima etapa. Por enquanto, monte o pedido e calcule o frete.</div>
  </div>
</aside>

<script>
(function(){
  "use strict";
  var esc=function(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");};
  var reais=function(c){return "R$ "+(Number(c||0)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});};
  var reaisF=function(v){return "R$ "+(Number(v||0)).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});};
  var PRODUTOS=[], CATS=[], filtroAtual="", produtoAberto=null, varSel=null;
  var freteSel=null, ultimoCarrinho=null;

  // ---- carrinho persistente ----
  function lerCart(){ try{ return JSON.parse(localStorage.getItem("aqualife_cart")||"[]"); }catch(e){ return []; } }
  function salvarCart(c){ try{ localStorage.setItem("aqualife_cart",JSON.stringify(c)); }catch(e){} atualizarBadge(); }
  function atualizarBadge(){ var n=lerCart().reduce(function(s,i){return s+(i.qty||0);},0); document.getElementById("cartBadge").textContent=n; }
  function addAoCarrinho(variacao_id, qty){
    var c=lerCart(); var ex=c.find(function(i){return i.variacao_id===variacao_id;});
    if(ex) ex.qty+=qty; else c.push({variacao_id:variacao_id, qty:qty});
    salvarCart(c);
  }
  function setQty(variacao_id, qty){
    var c=lerCart(); var ex=c.find(function(i){return i.variacao_id===variacao_id;});
    if(ex){ ex.qty=qty; if(ex.qty<=0) c=c.filter(function(i){return i.variacao_id!==variacao_id;}); }
    salvarCart(c); freteSel=null; renderCart();
  }
  function removerItem(variacao_id){ salvarCart(lerCart().filter(function(i){return i.variacao_id!==variacao_id;})); freteSel=null; renderCart(); }

  // ---- vitrine ----
  function precoTag(p){ return p.preco_a_partir==null?'<span style="color:var(--suave)">sob consulta</span>':'a partir de<br><b>'+reais(p.preco_a_partir)+'</b>'; }
  function cardHtml(p){
    var img=p.capa?'<img src="'+esc(p.capa)+'" alt="'+esc(p.nome)+'" loading="lazy">':'<div class="sem">sem foto</div>';
    var esg=Number(p.estoque_total)<=0?'<div class="prod-esg">Esgotado</div>':'';
    return '<div class="prod" data-id="'+p.id+'"><div class="prod-img">'+(p.destaque?'<span class="prod-dest">Destaque</span>':'')+img+'</div>'
      +'<div class="prod-b">'+(p.marca?'<div class="prod-marca">'+esc(p.marca)+'</div>':'')
      +'<div class="prod-nome">'+esc(p.nome)+'</div><div class="prod-preco">'+precoTag(p)+'</div>'+esg+'</div></div>';
  }
  function render(){
    var grade=document.getElementById("grade");
    var lista=filtroAtual?PRODUTOS.filter(function(p){return p.categoria_slug===filtroAtual;}):PRODUTOS;
    if(!lista.length){grade.innerHTML='<div class="vazio-loja">Nenhum produto por aqui ainda.</div>';return;}
    grade.innerHTML=lista.map(cardHtml).join("");
    grade.querySelectorAll(".prod").forEach(function(el){ el.onclick=function(){abrirProd(el.getAttribute("data-id"));}; });
  }
  function renderFiltros(){
    var f=document.getElementById("filtros");
    f.innerHTML='<span class="filtro'+(filtroAtual===""?" on":"")+'" data-cat="">Todos</span>'
      +CATS.map(function(c){return '<span class="filtro'+(filtroAtual===c.slug?" on":"")+'" data-cat="'+esc(c.slug)+'">'+esc(c.nome)+'</span>';}).join("");
    f.querySelectorAll(".filtro").forEach(function(el){ el.onclick=function(){filtroAtual=el.getAttribute("data-cat");renderFiltros();render();}; });
  }

  // ---- detalhe + adicionar ----
  function selecionarVar(v){ varSel=v; document.querySelectorAll("#pmVars .pm-var").forEach(function(e){e.classList.toggle("on",e.getAttribute("data-vid")===v.id);}); }
  async function abrirProd(id){
    try{
      var p=await fetch("/api/loja/produto/"+id).then(function(r){if(!r.ok)throw 0;return r.json();});
      produtoAberto=p; varSel=null;
      document.getElementById("pmMarca").textContent=p.marca||"";
      document.getElementById("pmNome").textContent=p.nome||"";
      document.getElementById("pmDesc").textContent=p.descricao||"";
      document.getElementById("pmMsg").textContent="";
      document.getElementById("qInput").value=1;
      var imgs=p.imagens||[], main=document.getElementById("pmMain");
      main.innerHTML=imgs.length?'<img src="'+esc(imgs[0].url)+'" alt="">':'<div class="sem">sem foto</div>';
      var th=document.getElementById("pmThumbs");
      th.innerHTML=imgs.map(function(im,i){return '<img src="'+esc(im.url)+'" data-i="'+i+'" class="'+(i===0?"on":"")+'">';}).join("");
      th.querySelectorAll("img").forEach(function(t){t.onclick=function(){main.innerHTML='<img src="'+t.getAttribute("src")+'">';th.querySelectorAll("img").forEach(function(x){x.classList.remove("on");});t.classList.add("on");};});
      var vs=p.variacoes||[];
      document.getElementById("pmVars").innerHTML=vs.map(function(v){
        var promo=v.preco_promo_cents&&v.preco_promo_cents>0;
        var preco=promo?'<s>'+reais(v.preco_cents)+'</s>'+reais(v.preco_promo_cents):reais(v.preco_cents);
        var esg=Number(v.estoque)<=0;
        return '<div class="pm-var'+(esg?' esg':'')+'" data-vid="'+v.id+'"><div><div class="pm-var-nome">'+esc(v.nome||p.nome)+'</div>'
          +'<div class="pm-var-est">'+(esg?"esgotado":(v.estoque+" em estoque"))+'</div></div><div class="pm-var-preco">'+preco+'</div></div>';
      }).join("");
      document.querySelectorAll("#pmVars .pm-var").forEach(function(el){
        el.onclick=function(){ if(el.classList.contains("esg"))return; var v=vs.find(function(x){return x.id===el.getAttribute("data-vid");}); selecionarVar(v); };
      });
      var primeira=vs.find(function(v){return Number(v.estoque)>0;});
      if(primeira) selecionarVar(primeira);
      document.getElementById("btnAdd").disabled=!primeira;
      document.getElementById("pm").classList.add("on");
    }catch(e){ alert("Não foi possível abrir o produto agora."); }
  }
  window.fecharProd=function(){document.getElementById("pm").classList.remove("on");};
  document.getElementById("pm").addEventListener("click",function(e){if(e.target.id==="pm")window.fecharProd();});
  document.getElementById("qMinus").onclick=function(){var i=document.getElementById("qInput");i.value=Math.max(1,(parseInt(i.value)||1)-1);};
  document.getElementById("qPlus").onclick=function(){var i=document.getElementById("qInput");i.value=(parseInt(i.value)||1)+1;};
  document.getElementById("btnAdd").onclick=function(){
    if(!varSel){document.getElementById("pmMsg").textContent="Escolha uma opção.";return;}
    var q=Math.max(1,parseInt(document.getElementById("qInput").value)||1);
    addAoCarrinho(varSel.id,q);
    var msg=document.getElementById("pmMsg"); msg.className="msg"; msg.style.color="var(--ok,#1F8A54)";
    msg.textContent="Adicionado ao carrinho ✓";
    setTimeout(function(){window.fecharProd();abrirCart();},450);
  };

  // ---- carrinho (gaveta) ----
  window.abrirCart=function(){document.getElementById("drawer").classList.add("on");document.getElementById("drawerBg").classList.add("on");renderCart();};
  window.fecharCart=function(){document.getElementById("drawer").classList.remove("on");document.getElementById("drawerBg").classList.remove("on");};
  document.getElementById("btnCart").onclick=window.abrirCart;

  async function renderCart(){
    var itens=lerCart(), body=document.getElementById("cartBody"), footer=document.getElementById("cartFooter");
    if(!itens.length){ body.innerHTML='<div class="carrinho-vazio">Seu carrinho está vazio.</div>'; footer.hidden=true; return; }
    body.innerHTML='<div class="carrinho-vazio">Carregando…</div>';
    var data;
    try{ data=await fetch("/api/loja/carrinho",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({itens:itens})}).then(function(r){return r.json();}); }
    catch(e){ body.innerHTML='<div class="carrinho-vazio">Erro ao carregar o carrinho.</div>'; return; }
    ultimoCarrinho=data;
    // reconcilia localStorage com o que o servidor validou (remove itens sumidos)
    var validos={}; (data.itens||[]).forEach(function(it){validos[it.variacao_id]=it.qty;});
    var novo=lerCart().filter(function(i){return validos[i.variacao_id]!=null;}).map(function(i){i.qty=validos[i.variacao_id];return i;});
    try{ localStorage.setItem("aqualife_cart",JSON.stringify(novo)); }catch(e){} atualizarBadge();
    if(!data.itens.length){ body.innerHTML='<div class="carrinho-vazio">Seu carrinho está vazio.</div>'; footer.hidden=true; return; }
    var html=data.itens.map(function(it){
      return '<div class="ci"><img src="'+(it.capa?esc(it.capa):"")+'" alt="">'
        +'<div class="ci-info"><div class="ci-nome">'+esc(it.produto)+'</div>'
        +'<div class="ci-var">'+esc(it.variacao||"")+'</div>'
        +'<div class="ci-preco">'+reais(it.preco_cents)+'</div>'
        +'<button class="ci-rm" data-rm="'+it.variacao_id+'">remover</button></div>'
        +'<div class="qtd"><button type="button" data-dec="'+it.variacao_id+'">−</button><input type="text" value="'+it.qty+'" readonly><button type="button" data-inc="'+it.variacao_id+'" data-est="'+it.estoque+'">+</button></div></div>';
    }).join("");
    if(data.indisponivel) html='<div class="msg err" style="margin-bottom:8px">Ajustamos algumas quantidades pelo estoque disponível.</div>'+html;
    html+=freteHtml();
    body.innerHTML=html;
    body.querySelectorAll("[data-rm]").forEach(function(b){b.onclick=function(){removerItem(b.getAttribute("data-rm"));};});
    body.querySelectorAll("[data-dec]").forEach(function(b){b.onclick=function(){var id=b.getAttribute("data-dec");var it=data.itens.find(function(x){return x.variacao_id===id;});setQty(id,it.qty-1);};});
    body.querySelectorAll("[data-inc]").forEach(function(b){b.onclick=function(){var id=b.getAttribute("data-inc");var est=parseInt(b.getAttribute("data-est"));var it=data.itens.find(function(x){return x.variacao_id===id;});if(it.qty>=est){return;}setQty(id,it.qty+1);};});
    ligarFrete();
    atualizarTotais();
    footer.hidden=false;
  }
  function freteHtml(){
    return '<div class="frete-box"><div style="font-size:13px;font-weight:600;color:var(--tinta);margin-bottom:8px">Calcular frete</div>'
      +'<div class="frete-cep"><input id="cepInput" placeholder="Seu CEP" inputmode="numeric" maxlength="9"><button id="btnFrete">Calcular</button></div>'
      +'<div id="freteMsg" class="msg"></div><div id="freteOps"></div></div>';
  }
  function ligarFrete(){
    var btn=document.getElementById("btnFrete"); if(!btn)return;
    btn.onclick=async function(){
      var cep=(document.getElementById("cepInput").value||"").replace(/\D/g,"");
      var msg=document.getElementById("freteMsg"), ops=document.getElementById("freteOps");
      if(cep.length!==8){msg.className="msg err";msg.textContent="Informe um CEP válido (8 dígitos).";return;}
      msg.className="msg";msg.textContent="Calculando…";ops.innerHTML="";freteSel=null;atualizarTotais();
      try{
        var r=await fetch("/api/loja/frete",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({cep_destino:cep,itens:lerCart()})});
        var d=await r.json();
        if(!r.ok){msg.className="msg err";msg.textContent=d.erro||"Não foi possível calcular o frete.";return;}
        if(!d.opcoes||!d.opcoes.length){msg.className="msg err";msg.textContent="Sem opções de frete para este CEP.";return;}
        msg.textContent="";
        ops.innerHTML=d.opcoes.map(function(o,i){
          return '<div class="frete-op" data-i="'+i+'" data-preco="'+o.preco+'"><span>'+esc(o.nome)+(o.empresa?' · '+esc(o.empresa):'')
            +(o.prazo_dias?' · '+o.prazo_dias+' dia(s)':'')+'</span><span class="p">'+reaisF(o.preco)+'</span></div>';
        }).join("");
        ops.querySelectorAll(".frete-op").forEach(function(el){
          el.onclick=function(){ ops.querySelectorAll(".frete-op").forEach(function(x){x.classList.remove("on");}); el.classList.add("on");
            freteSel={preco:parseFloat(el.getAttribute("data-preco")), nome:el.querySelector("span").textContent}; atualizarTotais(); };
        });
      }catch(e){msg.className="msg err";msg.textContent="Erro ao calcular o frete.";}
    };
  }
  function atualizarTotais(){
    if(!ultimoCarrinho)return;
    var sub=ultimoCarrinho.subtotal_cents||0;
    document.getElementById("tSub").textContent=reais(sub);
    document.getElementById("tFrete").textContent=freteSel?reaisF(freteSel.preco):"calcule acima";
    var total=sub/100+(freteSel?freteSel.preco:0);
    document.getElementById("tTotal").textContent=reaisF(total);
    document.getElementById("btnCheckout").disabled=!freteSel;
  }
  document.getElementById("btnCheckout").onclick=function(){
    alert("Pagamento e finalização entram na próxima etapa (Fase 3). Seu pedido e o frete já estão calculados!");
  };

  async function init(){
    atualizarBadge();
    try{
      var res=await Promise.all([fetch("/api/loja/categorias"),fetch("/api/loja/produtos")]);
      CATS=await res[0].json(); PRODUTOS=await res[1].json();
      renderFiltros(); render();
    }catch(e){ document.getElementById("grade").innerHTML='<div class="vazio-loja">Não foi possível carregar a loja agora.</div>'; }
  }
  init();
})();
</script>
<script src="/js/theme.js" defer></script>
