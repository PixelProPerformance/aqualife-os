<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("aq_theme")||"light");}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produto — Aqualife</title>
<meta name="description" id="metaDesc" content="Produtos de aquarismo selecionados pela Aqualife.">
<link rel="canonical" id="canon" href="">
<meta property="og:type" content="product">
<meta property="og:title" id="ogTitle" content="Aqualife">
<meta property="og:image" id="ogImg" content="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/loja-ds.css">
<style>
/* ---- ícones (estilo Apple/SF: traço fino, cantos arredondados) ---- */
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.pdp{padding:18px 0 120px}
.bc{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:var(--aq-fs-small);color:var(--aq-muted);margin-bottom:16px}
.bc a{color:var(--aq-muted);text-decoration:none}
.bc a:hover{color:var(--aq-blue)}
.bc .sep{opacity:.5}
.bc b{color:var(--aq-graphite);font-weight:600}

.pdp-top{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:900px){.pdp-top{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:start}}

/* galeria */
.gal-main{aspect-ratio:1/1;background:var(--aq-paper);border:var(--aq-border);border-radius:var(--aq-radius);overflow:hidden;position:relative}
.gal-main img{width:100%;height:100%;object-fit:contain}
.gal-main .aq-nofoto{display:flex;align-items:center;justify-content:center;height:100%;color:var(--aq-muted)}
.gal-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.gal-thumbs button{width:60px;height:60px;border-radius:var(--aq-radius-sm);border:2px solid var(--aq-line);background:var(--aq-paper);overflow:hidden;cursor:pointer;padding:0}
.gal-thumbs button.on{border-color:var(--aq-blue)}
.gal-thumbs img{width:100%;height:100%;object-fit:cover}
@media(min-width:900px){.gal-main{position:sticky;top:84px}}

/* info */
.pi-marca{font-size:var(--aq-fs-caption);text-transform:uppercase;letter-spacing:.05em;color:var(--aq-muted);font-weight:600}
.pi-nome{font-size:var(--aq-fs-h1);color:var(--aq-navy);font-weight:700;margin:2px 0 10px;line-height:1.2}
.pi-flags{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.pi-price{margin:14px 0}
.pi-price .de{font-size:var(--aq-fs-small);color:var(--aq-muted);text-decoration:line-through}
.pi-price .por{font-size:30px;font-weight:700;color:var(--aq-navy);line-height:1.05}
.pi-price .pix{color:var(--aq-ok);font-weight:600;font-size:var(--aq-fs-body);margin-top:2px}
.pi-price .parc{color:var(--aq-muted);font-size:var(--aq-fs-small)}
.pi-estoque{font-size:var(--aq-fs-small);font-weight:600;margin:10px 0}
.pi-estoque.ok{color:var(--aq-ok)} .pi-estoque.no{color:var(--aq-danger)}

.vars{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.var{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--aq-line-2);border-radius:var(--aq-radius-sm);padding:11px 13px;cursor:pointer;transition:border-color var(--aq-t),background var(--aq-t)}
.var:hover{border-color:var(--aq-blue)}
.var.on{border-color:var(--aq-blue);background:var(--aq-blue-050)}
.var.esg{opacity:.5;cursor:not-allowed}
.var .vn{font-weight:600;color:var(--aq-navy);font-size:var(--aq-fs-body)}
.var .ve{font-size:var(--aq-fs-caption);color:var(--aq-muted)}
.var .vp{font-weight:700;color:var(--aq-navy);white-space:nowrap}

.compra{display:flex;gap:10px;align-items:stretch;margin-top:14px}
.qty{display:flex;align-items:center;border:1px solid var(--aq-line-2);border-radius:var(--aq-radius-sm);overflow:hidden}
.qty button{width:44px;height:100%;min-height:var(--aq-tap);border:none;background:#fff;font-size:20px;color:var(--aq-navy);cursor:pointer}
.qty button:hover{background:var(--aq-paper)}
.qty input{width:46px;text-align:center;border:none;font:600 var(--aq-fs-body) var(--aq-font);color:var(--aq-navy);background:#fff}
.qty input:focus{outline:none}
.pi-actions-2{display:flex;gap:10px;margin-top:10px;align-items:center}
.favbtn{display:inline-flex;align-items:center;gap:7px;background:none;border:1px solid var(--aq-line-2);border-radius:var(--aq-radius-sm);
  min-height:var(--aq-tap);padding:0 14px;color:var(--aq-graphite);font:600 var(--aq-fs-small) var(--aq-font);cursor:pointer}
.favbtn[disabled]{opacity:.5;cursor:not-allowed}

.trust{display:grid;grid-template-columns:1fr;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--aq-line)}
.trust div{display:flex;align-items:center;gap:10px;font-size:var(--aq-fs-small);color:var(--aq-graphite)}
.trust .i{color:var(--aq-blue)}
@media(min-width:520px){.trust{grid-template-columns:1fr 1fr}}

/* blocos abaixo */
.bloco{margin-top:34px}
.bloco h2{font-size:var(--aq-fs-h2);color:var(--aq-navy);margin-bottom:12px}
.painel{background:var(--aq-white);border:var(--aq-border);border-radius:var(--aq-radius);padding:20px}

/* compatibilidade */
.compat-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.compat-form .aq-field{flex:1;min-width:130px}
.compat-res{margin-top:16px;border-radius:var(--aq-radius-sm);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:var(--aq-fs-body)}
.compat-res .i{width:22px;height:22px;margin-top:1px}
.compat-res.ok{background:var(--aq-ok-bg);color:var(--aq-ok)}
.compat-res.info{background:var(--aq-blue-050);color:var(--aq-blue-600)}
.compat-res.atencao{background:var(--aq-warn-bg);color:var(--aq-warn)}
.compat-res b{display:block;margin-bottom:2px;text-transform:uppercase;letter-spacing:.03em;font-size:var(--aq-fs-small)}

/* dica */
.dica{background:linear-gradient(180deg,var(--aq-blue-050),#fff);border:1px solid var(--aq-blue-050);border-left:3px solid var(--aq-blue);
  border-radius:var(--aq-radius);padding:18px 20px}
.dica .lbl{display:flex;align-items:center;gap:8px;color:var(--aq-blue-600);font-weight:700;font-size:var(--aq-fs-small);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.dica p{color:var(--aq-graphite);font-size:var(--aq-fs-body)}

/* specs */
.specs{width:100%;border-collapse:collapse}
.specs tr{border-bottom:1px solid var(--aq-line)}
.specs td{padding:10px 4px;font-size:var(--aq-fs-body)}
.specs td:first-child{color:var(--aq-muted);width:46%}
.specs td:last-child{color:var(--aq-navy);font-weight:600}
.desc-txt{color:var(--aq-graphite);font-size:var(--aq-fs-body);line-height:1.7;white-space:pre-line}

/* CTA fixo mobile */
.sticky-cta{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
  border-top:1px solid var(--aq-line);padding:10px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 -4px 16px rgba(11,27,51,.06)}
.sticky-cta .p{display:flex;flex-direction:column;line-height:1.15}
.sticky-cta .p small{color:var(--aq-muted);font-size:var(--aq-fs-caption)}
.sticky-cta .p b{color:var(--aq-navy);font-size:19px}
.sticky-cta .aq-btn{flex:1}
@media(min-width:900px){.sticky-cta{display:none}}

/* toast */
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--aq-navy);color:#fff;padding:12px 18px;border-radius:var(--aq-radius);font-size:var(--aq-fs-small);font-weight:600;
  display:flex;gap:12px;align-items:center;box-shadow:var(--aq-shadow-hover);transition:opacity var(--aq-t),transform var(--aq-t);z-index:90}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast a{color:#8FB4FF;font-weight:700;text-decoration:none}
@media(min-width:900px){.toast{bottom:24px}}
</style>
</head>
<body class="aq-scope">

<header class="topo">
  <div class="wrap topo-in">
    <a class="marca" href="/loja.html" aria-label="Aqualife" style="text-decoration:none">
      <img src="/images/logo-azul.png" alt="Aqualife" style="height:36px;display:block" onerror="this.outerHTML='<span class=&quot;marca-i&quot;>A</span><span class=&quot;marca-t&quot;>Aqualife<small>AQUARISMO</small></span>'">
    </a>
    <a href="/loja.html" class="aq-btn aq-btn--ghost aq-btn--sm" style="margin-left:auto" aria-label="Voltar à loja">
      <svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg> Loja
    </a>
    <button class="aq-btn aq-btn--ghost aq-btn--sm" id="btnCart" style="position:relative" aria-label="Carrinho">
      <svg class="i" viewBox="0 0 24 24"><path d="M6 6h15l-1.6 9H8z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg>
      <span id="cartBadge" style="position:absolute;top:-6px;right:-6px;background:var(--aq-blue);color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px">0</span>
    </button>
  </div>
</header>

<main class="wrap pdp" id="conteudo">
  <div class="vazio" id="carregando">Carregando produto…</div>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");};
  var reais=function(c){return "R$ "+(Number(c||0)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});};
  var COMERCIAL={pix_desconto_pct:0,parcelas_max:1,parcela_min_cents:0};
  var P=null, varSel=null, RELAC=[];
  var LSIS={doce:"água doce",marinho:"marinho",plantado:"plantado",lago:"lago/lago ornamental"};

  function track(ev,data){ try{(window.dataLayer=window.dataLayer||[]).push(Object.assign({event:ev},data||{}));}catch(e){} }
  function itemGA(p,q){ return {item_id:p.id,item_name:p.nome,item_brand:p.marca||undefined,item_category:p.categoria||undefined,
    price:precoAtual()!=null?+(precoAtual()/100).toFixed(2):undefined,quantity:q||undefined}; }

  // ---- carrinho (mesmo localStorage da loja.html) ----
  function lerCart(){ try{return JSON.parse(localStorage.getItem("aqualife_cart")||"[]");}catch(e){return [];} }
  function salvarCart(c){ try{localStorage.setItem("aqualife_cart",JSON.stringify(c));}catch(e){} badge(); }
  function badge(){ var n=lerCart().reduce(function(s,i){return s+(i.qty||0);},0); if($("cartBadge"))$("cartBadge").textContent=n; }
  function addCart(vid,q){ var c=lerCart(),ex=c.find(function(i){return i.variacao_id===vid;}); if(ex)ex.qty+=q; else c.push({variacao_id:vid,qty:q}); salvarCart(c); }

  function qParam(){ var q=new URLSearchParams(location.search); return {id:q.get("id"),slug:q.get("slug")}; }
  function precoAtual(){ if(!varSel) return P?P: null && null; if(!varSel) return null;
    return (varSel.preco_promo_cents&&varSel.preco_promo_cents>0)?varSel.preco_promo_cents:varSel.preco_cents; }
  function precoCheio(){ return varSel?varSel.preco_cents:null; }
  function temPromo(){ return varSel && varSel.preco_promo_cents>0 && varSel.preco_promo_cents<varSel.preco_cents; }

  function blocoPreco(){
    var atual=precoAtual(); if(atual==null) return '<div class="pi-price"><span class="aq-muted">Selecione uma opção</span></div>';
    var de=temPromo()?'<span class="de">'+reais(precoCheio())+'</span><br>':'';
    var pix='';
    if(COMERCIAL.pix_desconto_pct>0){ var v=Math.round(atual*(1-COMERCIAL.pix_desconto_pct/100));
      pix='<div class="pix">'+reais(v)+' no PIX ('+COMERCIAL.pix_desconto_pct+'% de desconto)</div>'; }
    var parc='';
    if(COMERCIAL.parcelas_max>1){ var n=COMERCIAL.parcelas_max;
      if(COMERCIAL.parcela_min_cents>0){ while(n>1 && (atual/n)<COMERCIAL.parcela_min_cents) n--; }
      if(n>1) parc='<div class="parc">em até '+n+'x de '+reais(Math.round(atual/n))+' sem juros</div>'; }
    return '<div class="pi-price">'+de+'<span class="por">'+reais(atual)+'</span>'+pix+parc+'</div>';
  }

  function estoqueSel(){ return varSel?Number(varSel.estoque)||0:0; }
  function atualizaPreco(){
    $("precoBox").innerHTML=blocoPreco();
    var e=estoqueSel();
    var el=$("estoqueBox"); el.className="pi-estoque "+(e>0?"ok":"no");
    el.textContent=e>0?(e>=5?"Em estoque":"Últimas "+e+" unidades"):"Indisponível";
    $("btnComprar").disabled=e<=0; $("ctaComprar").disabled=e<=0;
    $("ctaPreco").innerHTML="<small>"+(temPromo()?"por":"")+"</small><b>"+(precoAtual()!=null?reais(precoAtual()):"—")+"</b>";
    var qi=$("qInput"); if(qi && Number(qi.value)>e) qi.value=Math.max(1,e);
  }
  function selVar(v){ varSel=v; document.querySelectorAll(".var").forEach(function(el){el.classList.toggle("on",el.getAttribute("data-vid")===v.id);}); atualizaPreco(); }

  // ---- compatibilidade (só com dados reais) ----
  function temCompat(){ return P && (P.litragem_min!=null || P.litragem_max!=null || P.sistema); }
  function checar(vol,sis){
    if(P.sistema && sis && P.sistema!==sis)
      return {n:"atencao",t:"Atenção",m:"Este produto é indicado para sistema de "+LSIS[P.sistema]+". Verifique antes de comprar."};
    if(vol==null||isNaN(vol)) return null;
    if(P.litragem_max!=null && vol>P.litragem_max)
      return {n:"atencao",t:"Pode estar subdimensionado",m:"Recomendado para aquários de até "+P.litragem_max+" L. Para "+vol+" L, considere um modelo maior ou unidades adicionais."};
    if(P.litragem_min!=null && vol<P.litragem_min)
      return {n:"info",t:"Acima do necessário",m:"Indicado a partir de "+P.litragem_min+" L. Funciona no seu aquário de "+vol+" L, com folga."};
    return {n:"ok",t:"Compatível",m:"Indicado para o seu aquário de "+vol+" L"+(P.sistema?(" ("+LSIS[P.sistema]+")"):"")+"."};
  }

  function specsRows(){
    var r=[];
    if(P.marca) r.push(["Marca",esc(P.marca)]);
    if(P.modelo) r.push(["Modelo",esc(P.modelo)]);
    if(P.sistema) r.push(["Sistema",LSIS[P.sistema]]);
    if(P.litragem_min!=null||P.litragem_max!=null) r.push(["Indicado para",(P.litragem_min!=null?P.litragem_min:"—")+" a "+(P.litragem_max!=null?P.litragem_max+" L":"—")]);
    if(P.vazao_lh!=null) r.push(["Vazão","até "+P.vazao_lh+" L/h"]);
    if(P.garantia_meses) r.push(["Garantia",P.garantia_meses+" meses"]);
    if(P.peso_gramas) r.push(["Peso",(P.peso_gramas/1000).toLocaleString("pt-BR")+" kg"]);
    if(P.altura_cm||P.largura_cm||P.comprimento_cm) r.push(["Dimensões",(P.largura_cm||"—")+" × "+(P.altura_cm||"—")+" × "+(P.comprimento_cm||"—")+" cm"]);
    if(P.condicao) r.push(["Condição",P.condicao==="usado"?"Usado":"Novo"]);
    return r;
  }

  function cardMini(p){
    var atual=p.preco_a_partir, esg=Number(p.estoque_total)<=0;
    var img=p.capa?'<img src="'+esc(p.capa)+'" alt="'+esc(p.nome)+'" loading="lazy" width="240" height="240">':'<div class="aq-nofoto">sem foto</div>';
    return '<a class="aq-card" href="/produto.html?slug='+esc(p.slug||"")+'" style="text-decoration:none">'
      +'<div class="aq-card__media">'+(esg?'<div class="aq-card__flags"><span class="aq-badge aq-badge--esgotado">Esgotado</span></div>':'')+img+'</div>'
      +'<div class="aq-card__body">'+(p.marca?'<div class="aq-card__marca">'+esc(p.marca)+'</div>':'')
      +'<div class="aq-card__nome">'+esc(p.nome)+'</div>'
      +'<div class="aq-price"><span class="aq-price__por">'+(atual!=null?reais(atual):"sob consulta")+'</span></div></div></a>';
  }

  function seo(){
    var titulo=(P.nome||"Produto")+" — Aqualife";
    document.title=titulo;
    var img=(P.imagens&&P.imagens[0])?P.imagens[0].url:"";
    var desc=(P.descricao||P.nome||"").slice(0,160);
    $("metaDesc").setAttribute("content",desc);
    $("ogTitle").setAttribute("content",titulo);
    if(img) $("ogImg").setAttribute("content",img);
    var url=location.origin+"/produto.html?slug="+encodeURIComponent(P.slug||"");
    $("canon").setAttribute("href",url);
    var atual=precoAtual();
    var ld={"@context":"https://schema.org","@type":"Product","name":P.nome,"brand":P.marca||undefined,
      "description":desc,"image":img||undefined,"sku":(P.variacoes&&P.variacoes[0]&&P.variacoes[0].sku)||undefined,
      "offers":{"@type":"Offer","priceCurrency":"BRL","price":atual!=null?(atual/100).toFixed(2):undefined,
        "availability":estoqueSel()>0?"https://schema.org/InStock":"https://schema.org/OutOfStock","url":url}};
    var bc={"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[
      {"@type":"ListItem","position":1,"name":"Loja","item":location.origin+"/loja.html"},
      P.categoria?{"@type":"ListItem","position":2,"name":P.categoria,"item":location.origin+"/loja.html?cat="+encodeURIComponent(P.categoria_slug||"")}:null,
      {"@type":"ListItem","position":P.categoria?3:2,"name":P.nome}].filter(Boolean)};
    var s=document.createElement("script"); s.type="application/ld+json"; s.textContent=JSON.stringify([ld,bc]); document.head.appendChild(s);
  }

  function toast(msg){
    var t=$("toast"); t.innerHTML=msg+' <a href="/loja.html?cart=1">Ver carrinho</a>';
    t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove("on");},3500);
  }

  function comprar(){
    if(!varSel||estoqueSel()<=0) return;
    var q=Math.max(1,Math.min(estoqueSel(),parseInt($("qInput").value)||1));
    addCart(varSel.id,q);
    track("add_to_cart",{currency:"BRL",value:precoAtual()!=null?+(precoAtual()*q/100).toFixed(2):undefined,items:[Object.assign(itemGA(P,q),{item_variant:varSel.nome||undefined})]});
    toast("Adicionado ao carrinho ✓");
  }

  function render(){
    var imgs=P.imagens||[], vs=P.variacoes||[];
    var esgTudo=vs.every(function(v){return Number(v.estoque)<=0;});
    var flags=[];
    if(esgTudo) flags.push('<span class="aq-badge aq-badge--esgotado">Esgotado</span>');
    else if(temPromo()) flags.push('<span class="aq-badge aq-badge--oferta">Oferta</span>');
    if(P.destaque && !esgTudo) flags.push('<span class="aq-badge aq-badge--destaque">Destaque</span>');

    var gal=imgs.length
      ? '<div class="gal-main"><img id="galMain" src="'+esc(imgs[0].url)+'" alt="'+esc(P.nome)+'"></div>'
        +(imgs.length>1?'<div class="gal-thumbs">'+imgs.map(function(im,i){return '<button type="button" data-i="'+i+'" class="'+(i===0?"on":"")+'"><img src="'+esc(im.url)+'" alt="" loading="lazy"></button>';}).join("")+'</div>':'')
      : '<div class="gal-main"><div class="aq-nofoto">sem foto</div></div>';

    var varsHtml=vs.length>1?'<div class="vars">'+vs.map(function(v){
        var esg=Number(v.estoque)<=0, promo=v.preco_promo_cents>0&&v.preco_promo_cents<v.preco_cents;
        var pv=promo?reais(v.preco_promo_cents):reais(v.preco_cents);
        return '<div class="var'+(esg?' esg':'')+'" data-vid="'+esc(v.id)+'"><div><div class="vn">'+esc(v.nome||P.nome)+'</div>'
          +'<div class="ve">'+(esg?"esgotado":(v.estoque+" em estoque"))+'</div></div><div class="vp">'+pv+'</div></div>';
      }).join("")+'</div>':'';

    var trust='<div class="trust">'
      +'<div><svg class="i" viewBox="0 0 24 24"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7.5" cy="18" r="1.6"/><circle cx="17.5" cy="18" r="1.6"/></svg> Frete calculado por CEP</div>'
      +'<div><svg class="i" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9.5 12l2 2 3.5-4"/></svg> Pagamento seguro (Mercado Pago)</div>'
      +'<div><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg> Troca facilitada (7 dias)</div>'
      +'<div><svg class="i" viewBox="0 0 24 24"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 16.5 7.1 19l.9-5.5-4-3.9 5.5-.8z"/></svg> Curadoria de especialista</div>'
      +'</div>';

    var info='<div class="pi">'
      +(flags.length?'<div class="pi-flags">'+flags.join("")+'</div>':'')
      +(P.marca?'<div class="pi-marca">'+esc(P.marca)+'</div>':'')
      +'<h1 class="pi-nome">'+esc(P.nome)+'</h1>'
      +'<div id="precoBox"></div>'
      +'<div id="estoqueBox" class="pi-estoque"></div>'
      +varsHtml
      +'<div class="compra"><div class="qty"><button type="button" id="qMinus" aria-label="Diminuir">−</button>'
        +'<input id="qInput" type="text" inputmode="numeric" value="1" aria-label="Quantidade"><button type="button" id="qPlus" aria-label="Aumentar">+</button></div>'
        +'<button class="aq-btn aq-btn--primary" id="btnComprar" style="flex:1"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M6 6h15l-1.6 9H8z"/><path d="M6 6 5 3H2"/></svg> Comprar</button></div>'
      +'<div class="pi-actions-2"><button class="favbtn" disabled title="Favoritos (em breve)"><svg class="i" viewBox="0 0 24 24"><path d="M12 20s-7-4.3-7-9.3A3.7 3.7 0 0 1 12 7a3.7 3.7 0 0 1 7 3.7C19 15.7 12 20 12 20z"/></svg> Favoritar</button></div>'
      +trust
      +'</div>';

    var html='<nav class="bc" aria-label="trilha"><a href="/loja.html">Loja</a>'
      +(P.categoria?'<span class="sep">›</span><a href="/loja.html?cat='+esc(P.categoria_slug||"")+'">'+esc(P.categoria)+'</a>':'')
      +'<span class="sep">›</span><b>'+esc(P.nome)+'</b></nav>'
      +'<div class="pdp-top"><div class="gal">'+gal+'</div>'+info+'</div>';

    // compatibilidade
    if(temCompat()){
      html+='<section class="bloco"><h2>Esse produto serve para o meu aquário?</h2><div class="painel">'
        +'<div class="compat-form">'
        +'<div class="aq-field"><label class="aq-label" for="cVol">Volume do aquário (litros)</label><input class="aq-input" id="cVol" type="number" min="1" placeholder="200"></div>'
        +'<div class="aq-field"><label class="aq-label" for="cSis">Sistema</label><select class="aq-select" id="cSis"><option value="">Selecione</option><option value="doce">Água doce</option><option value="plantado">Plantado</option><option value="marinho">Marinho</option><option value="lago">Lago</option></select></div>'
        +'<button class="aq-btn aq-btn--ghost" id="cBtn" type="button">Verificar</button></div>'
        +'<div id="cRes"></div>'
        +'<p class="aq-small aq-muted" style="margin-top:10px">Baseado nos dados técnicos cadastrados deste produto.</p>'
        +'</div></section>';
    }
    // dica
    if(P.dica_tecnica){
      html+='<section class="bloco"><div class="dica"><div class="lbl"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 4 10.5c-.6.6-1 1.4-1 2.5H9c0-1.1-.4-1.9-1-2.5A6 6 0 0 1 12 3z"/></svg> Dica Aqualife</div><p>'+esc(P.dica_tecnica)+'</p></div></section>';
    }
    // specs
    var rows=specsRows();
    if(rows.length){
      html+='<section class="bloco"><h2>Especificações</h2><div class="painel"><table class="specs"><tbody>'
        +rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';}).join("")+'</tbody></table></div></section>';
    }
    // descrição
    if(P.descricao){
      html+='<section class="bloco"><h2>Descrição</h2><div class="painel"><div class="desc-txt">'+esc(P.descricao)+'</div></div></section>';
    }
    // cross-sell
    html+='<section class="bloco" id="relacBloco" hidden><h2>Complete seu sistema</h2><div class="aq-grid-prod" id="relacGrade"></div></section>';

    // sticky mobile
    html+='';
    $("conteudo").innerHTML=html;

    // sticky CTA (fora do main para ficar fixo)
    var sc=document.createElement("div"); sc.className="sticky-cta";
    sc.innerHTML='<div class="p" id="ctaPreco"></div><button class="aq-btn aq-btn--primary" id="ctaComprar">Comprar</button>';
    document.body.appendChild(sc);

    // liga eventos
    if(imgs.length>1){
      $("conteudo").querySelectorAll(".gal-thumbs button").forEach(function(b){
        b.onclick=function(){ var i=+b.getAttribute("data-i"); $("galMain").src=imgs[i].url;
          $("conteudo").querySelectorAll(".gal-thumbs button").forEach(function(x){x.classList.remove("on");}); b.classList.add("on"); };
      });
    }
    if(vs.length>1){
      $("conteudo").querySelectorAll(".var").forEach(function(el){
        el.onclick=function(){ if(el.classList.contains("esg"))return; var v=vs.find(function(x){return x.id===el.getAttribute("data-vid");}); selVar(v); };
      });
    }
    var primeira=vs.find(function(v){return Number(v.estoque)>0;})||vs[0];
    if(primeira) selVar(primeira); else atualizaPreco();

    $("qMinus").onclick=function(){ var i=$("qInput"); i.value=Math.max(1,(parseInt(i.value)||1)-1); };
    $("qPlus").onclick=function(){ var i=$("qInput"),mx=estoqueSel(),n=(parseInt(i.value)||1)+1; i.value=mx>0?Math.min(mx,n):1; };
    $("btnComprar").onclick=comprar; $("ctaComprar").onclick=comprar;

    if(temCompat()){
      $("cBtn").onclick=function(){
        var vol=parseInt($("cVol").value), sis=$("cSis").value;
        var r=checar(isNaN(vol)?null:vol,sis||null);
        track("compatibility_check",{item_id:P.id,volume:isNaN(vol)?null:vol,sistema:sis||null,resultado:r?r.n:null});
        if(!r){ $("cRes").innerHTML='<div class="compat-res info"><span>Informe o volume do seu aquário.</span></div>'; return; }
        var icon=r.n==="ok"?'<path d="M20 6 9 17l-5-5"/>':(r.n==="atencao"?'<path d="M12 3 2 20h20L12 3z"/><path d="M12 9v5M12 17h.01"/>':'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>');
        $("cRes").innerHTML='<div class="compat-res '+r.n+'"><svg class="i" viewBox="0 0 24 24">'+icon+'</svg><span><b>'+r.t+'</b>'+esc(r.m)+'</span></div>';
      };
    }

    seo(); atualizaPreco(); badge();
    track("view_item",{currency:"BRL",value:precoAtual()!=null?+(precoAtual()/100).toFixed(2):undefined,items:[itemGA(P,1)]});

    // relacionados
    fetch("/api/loja/produto/"+P.id+"/relacionados").then(function(r){return r.json();}).then(function(list){
      RELAC=Array.isArray(list)?list:[]; if(!RELAC.length) return;
      $("relacGrade").innerHTML=RELAC.map(cardMini).join(""); $("relacBloco").hidden=false;
    }).catch(function(){});
  }

  $("btnCart").onclick=function(){ location.href="/loja.html?cart=1"; };

  async function init(){
    badge();
    var p=qParam(); var key=p.slug||p.id;
    if(!key){ $("conteudo").innerHTML='<div class="vazio">Produto não informado.</div>'; return; }
    try{
      var res=await Promise.all([fetch("/api/loja/produto/"+encodeURIComponent(key)),fetch("/api/loja/comercial")]);
      if(!res[0].ok) throw 0;
      P=await res[0].json();
      try{ COMERCIAL=await res[1].json(); }catch(e){}
      render();
    }catch(e){ $("conteudo").innerHTML='<div class="vazio">Produto não encontrado. <a href="/loja.html">Voltar à loja</a></div>'; }
  }
  init();
})();
</script>
<script src="/js/theme.js" defer></script>
</body>
</html>
