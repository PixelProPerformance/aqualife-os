<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Termo de Serviço — Aqualife</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
.wrap-t{max-width:760px;margin:0 auto;padding:32px 18px}
.wrap-t h1{font-size:22px;color:var(--tinta);margin-bottom:4px}
.wrap-t .sub{font-size:13px;color:var(--suave);margin-bottom:22px}
.doc{font-size:14.5px;line-height:1.65;color:#334155}
.doc h3{font-size:15px;color:var(--agua-esc);margin:20px 0 6px}
.doc ul{margin:6px 0 6px 20px}.doc li{margin-bottom:3px}
.doc .t-sub{color:var(--suave);font-size:12.5px}
.doc .t-nota{font-size:12.5px;color:var(--suave);font-style:italic;background:var(--papel);padding:8px 12px;border-radius:8px}
.voltar{display:inline-block;margin-bottom:18px;font-size:13.5px;color:var(--agua);text-decoration:none}
</style>
</head>
<body>
<header class="topo"><div class="wrap topo-in">
  <div class="marca"><a href="/site.html"><img src="/images/logo-azul.png" alt="Aqualife" style="height:34px" onerror="this.style.display='none'"></a></div>
</div></header>
<main class="wrap-t">
  <a class="voltar" href="/site.html">← Voltar ao site</a>
  <h1 id="titulo">Termo de Serviço</h1>
  <div class="sub" id="sub"></div>
  <div class="doc" id="doc">Carregando…</div>
</main>
<script>
fetch("/api/termo").then(r=>r.json()).then(t=>{
  document.getElementById("titulo").textContent=t.titulo;
  document.getElementById("sub").textContent="Versão "+t.versao+" · Atualizado em "+t.atualizado;
  document.getElementById("doc").innerHTML=t.html;
  document.title=t.titulo+" — Aqualife";
}).catch(()=>{ document.getElementById("doc").textContent="Não foi possível carregar o termo agora."; });
</script>
</body>
</html>
