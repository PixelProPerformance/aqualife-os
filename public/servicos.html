<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal do técnico — Aqualife</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
.sec{padding:26px 0}
.bloco{padding:20px 22px;margin-bottom:20px}
.bloco h2{font-size:16px;margin-bottom:12px}
.op{border:1px solid var(--linha);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.op h3{font-size:15px;margin:0 0 4px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.fotos{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.fotos img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--linha)}
.termos{background:var(--papel);border-radius:9px;padding:10px 14px;font-size:13px;color:var(--corpo);margin:10px 0}
.linha{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--linha);font-size:14px}
.reemb-item{display:flex;gap:6px;margin-bottom:6px}
.reemb-item input{padding:8px 10px}
</style>
</head>
<body>
<header class="topo">
  <div class="wrap topo-in">
    <div class="marca"><a href="/dashboard.html"><img src="/images/logo-azul.png" alt="Aqualife" style="height:34px;display:block" onerror="this.style.display='none'"></a></div>
    <nav style="margin-left:auto;display:flex;gap:10px"><a href="/dashboard.html" class="btn btn-c btn-sm">Painel</a><a href="/conta.html" class="btn btn-c btn-sm">Conta</a></nav>
  </div>
</header>
<main class="wrap sec" style="max-width:820px">
  <h1 style="font-size:24px;margin-bottom:4px">Portal do técnico</h1>
  <p style="color:var(--suave);margin-bottom:18px" id="ola">Oportunidades de manutenção, relatórios e recebimentos.</p>

  <!-- Contrato + PIX -->
  <div class="cartao bloco">
    <h2>Meu contrato e recebimento</h2>
    <div id="contratoInfo" style="font-size:14px;margin-bottom:12px">Carregando…</div>
    <div class="duo">
      <div class="campo"><label>Tipo de chave PIX</label>
        <select class="inp" id="pixTipo"><option value="cpf">CPF</option><option value="cnpj">CNPJ</option><option value="email">E-mail</option><option value="telefone">Telefone</option><option value="aleatoria">Aleatória</option></select></div>
      <div class="campo"><label>Chave PIX</label><input class="inp" id="pixChave" placeholder="sua chave PIX"></div>
    </div>
    <div class="campo"><label>Titular da conta</label><input class="inp" id="pixTitular" placeholder="Nome do titular"></div>
    <button class="btn btn-p btn-sm" id="salvarPix">Salvar PIX</button>
    <span id="pixMsg" style="font-size:13px;margin-left:10px"></span>
  </div>

  <!-- Oportunidades abertas -->
  <div class="cartao bloco">
    <h2>Oportunidades disponíveis</h2>
    <div id="abertas"><div class="vazio" style="padding:8px 0">Carregando…</div></div>
  </div>

  <!-- Minhas manutenções -->
  <div class="cartao bloco">
    <h2>Minhas manutenções</h2>
    <div id="minhas"><div class="vazio" style="padding:8px 0">Carregando…</div></div>
  </div>

  <!-- Recebimentos -->
  <div class="cartao bloco">
    <h2>Recebimentos previstos</h2>
    <div id="recebimentos"><div class="vazio" style="padding:8px 0">Carregando…</div></div>
  </div>
</main>

<!-- MODAL RELATÓRIO -->
<div class="modal" id="modalRel"><div class="modal-cx" style="max-width:560px">
  <h3>Relatório de manutenção</h3>
  <input type="hidden" id="relOpId">
  <div class="campo"><label>O que foi feito *</label><textarea class="inp" id="relObs" rows="4" placeholder="Descreva o serviço realizado, estado do aquário, recomendações…"></textarea></div>
  <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;margin-bottom:10px"><input type="checkbox" id="relResolvido" checked style="width:auto"> A manutenção foi resolvida (não precisa de retorno)</label>
  <div class="campo"><label>Fotos</label><input type="file" id="relFotos" accept="image/*" multiple style="font-size:13px"><div class="fotos" id="relFotosPrev"></div></div>
  <div class="campo"><label>Reembolsos de produtos (até R$ 100 no total é pré-aprovado)</label>
    <div id="relReemb"></div>
    <button type="button" class="btn btn-c btn-sm" id="relAddReemb">+ Adicionar item</button>
  </div>
  <div class="modal-acoes">
    <span class="msg" id="relMsg" style="font-size:13px"></span>
    <span style="display:flex;gap:8px"><button class="btn btn-c" type="button" id="relCancelar">Cancelar</button>
    <button class="btn btn-p" id="relEnviar">Enviar relatório</button></span>
  </div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const token=localStorage.getItem("aqualife_token");
if(!token){ location.href="/entrar.html"; }
const brl=c=>(Number(c||0)/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(c,o={}){
  const r=await fetch(c,{...o,headers:{...(o.body?{"content-type":"application/json"}:{}),authorization:"Bearer "+token}});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.erro||"HTTP "+r.status);}
  return r.json();
}
function abrir(id){ $(id).classList.add("on"); }
function fechar(id){ $(id).classList.remove("on"); }

const OST={rascunho:["Rascunho","#92400E","#FEF3C7"],aberta:["Disponível","#0E5566","#E6F4F7"],aceita:["Aceita","#1D4ED8","#DBEAFE"],relatorio_enviado:["Em avaliação","#92400E","#FEF3C7"],concluida:["Concluída","#065F46","#D1FAE5"],retorno:["Retorno aberto","#9A3412","#FFEDD5"],recusada:["Recusada","#991B1B","#FEE2E2"],cancelada:["Cancelada","#374151","#E5E7EB"]};
let CONTRATO=null;

function termosTexto(){
  const t=CONTRATO?CONTRATO.contrato_tipo:"servico";
  const base="Pagamentos a cada 7 dias úteis após a manutenção (fechamento toda segunda, somando a semana anterior). Reembolso de produtos ligados à manutenção até R$ 100 é pré-aprovado; acima disso, consultar a Aqualife antes. Recebimentos sempre em dias úteis, via PIX cadastrado.";
  if(t==="servico") return "Contrato por serviço: o pagamento é pelo serviço resolvido, portanto retornos fazem parte da entrega. "+base;
  if(t==="diaria") return "Contrato por diária: em caso de retorno sem outra manutenção paga no mesmo dia, recebe-se meia diária. "+base;
  if(t==="fixo") return "Contrato fixo mensal: um dia de trabalho normal, sem valor avulso por manutenção. "+base;
  return base;
}

async function carregarContrato(){
  try{
    const d=await api("/api/tecnico/pix"); CONTRATO=d;
    $("ola").textContent="Seu contrato: "+(d.contrato_label||"—")+(d.contrato_valor_cents?(" · valor de referência "+brl(d.contrato_valor_cents)):"");
    $("contratoInfo").innerHTML='<b>'+esc(d.contrato_label||"—")+'</b>'+(d.contrato_valor_cents?(' — '+brl(d.contrato_valor_cents)):'')+'<div class="termos">'+esc(termosTexto())+'</div>';
    $("pixTipo").value=d.pix_tipo||"cpf"; $("pixChave").value=d.pix_chave||""; $("pixTitular").value=d.pix_titular||"";
  }catch(e){ $("contratoInfo").textContent="Erro: "+e.message; }
}
$("salvarPix").onclick=async()=>{
  $("pixMsg").textContent="Salvando…"; $("pixMsg").style.color="var(--suave)";
  try{ await api("/api/tecnico/pix",{method:"PUT",body:JSON.stringify({pix_tipo:$("pixTipo").value,pix_chave:$("pixChave").value.trim(),pix_titular:$("pixTitular").value.trim()})});
    $("pixMsg").style.color="#1a8f66"; $("pixMsg").textContent="✓ PIX salvo."; }
  catch(e){ $("pixMsg").style.color="#B4232E"; $("pixMsg").textContent=e.message; }
};

function opCard(o,minha){
  const st=OST[o.status]||["",""," "];
  let h='<div class="op"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><h3>'+esc(o.titulo)+(o.is_retorno?' 🔁':'')+'</h3>'
    +'<div style="font-size:12.5px;color:var(--suave)">'+(o.regiao?esc(o.regiao)+" · ":"")+(o.data_servico?("🗓️ "+o.data_servico):"sem data")+(o.hora?(" "+esc(o.hora)):"")+'</div></div>'
    +'<span class="pill" style="background:'+st[2]+';color:'+st[1]+'">'+st[0]+'</span></div>';
  if(o.descricao) h+='<div style="white-space:pre-wrap;font-size:13.5px;margin-top:8px">'+esc(o.descricao)+'</div>';
  if(o.deslocamento_cents) h+='<div style="font-size:12.5px;color:#176B42;margin-top:6px">🚗 Deslocamento pago: '+brl(o.deslocamento_cents)+'</div>';
  if(o.fotos&&o.fotos.length) h+='<div class="fotos">'+o.fotos.map(u=>'<a href="'+esc(u)+'" target="_blank"><img src="'+esc(u)+'"></a>').join("")+'</div>';
  if(!minha && o.status==="aberta"){
    const pedeData = o.is_retorno || !o.data_servico;
    h+='<div class="termos">'+esc(termosTexto())+'</div>';
    if(pedeData){
      h+='<div class="duo" style="margin:6px 0"><div class="campo" style="margin:0"><label>Data que você fará</label><input class="inp" type="date" data-data="'+o.id+'"></div>'
        +'<div class="campo" style="margin:0"><label>Horário</label><input class="inp" data-hora="'+o.id+'" placeholder="Ex.: 14h"></div></div>';
    }
    h+='<label style="display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;margin:6px 0"><input type="checkbox" data-termos="'+o.id+'" style="width:auto"> Li e aceito os termos deste serviço</label>'
      +'<div style="display:flex;gap:8px"><button class="btn btn-p btn-sm" data-aceitar="'+o.id+'">Aceitar manutenção</button>'
      +'<button class="btn btn-c btn-sm" data-recusar="'+o.id+'">Recusar</button></div>';
  }
  if(minha){
    if(o.status==="aceita") h+='<div style="margin-top:10px"><button class="btn btn-p btn-sm" data-relatorio="'+o.id+'">📝 Enviar relatório</button></div>';
    if(o.status==="concluida") h+='<div class="termos" style="background:#E7F6EC;color:#176B42">✅ Concluída — '+brl(o.valor_final_cents!=null?o.valor_final_cents:0)+(o.meia_diaria?' (meia diária)':'')+(o.previsao_pagamento?(' · previsão de recebimento: '+o.previsao_pagamento):'')+'</div>';
    if(o.status==="relatorio_enviado") h+='<div style="font-size:13px;color:var(--suave);margin-top:8px">Relatório enviado. Aguardando a Aqualife avaliar (concluir ou pedir retorno).</div>';
  }
  h+='</div>';
  return h;
}
async function carregarOportunidades(){
  try{
    const d=await api("/api/tecnico/oportunidades");
    $("abertas").innerHTML=d.abertas.length?d.abertas.map(o=>opCard(o,false)).join(""):'<div class="vazio" style="padding:8px 0">Nenhuma oportunidade disponível agora.</div>';
    $("minhas").innerHTML=d.minhas.length?d.minhas.map(o=>opCard(o,true)).join(""):'<div class="vazio" style="padding:8px 0">Você ainda não tem manutenções.</div>';
    document.querySelectorAll("[data-aceitar]").forEach(b=>b.onclick=async()=>{
      const id=b.dataset.aceitar; const chk=document.querySelector('[data-termos="'+id+'"]');
      if(!chk||!chk.checked){ alert("Marque que leu e aceita os termos."); return; }
      const dEl=document.querySelector('[data-data="'+id+'"]'), hEl=document.querySelector('[data-hora="'+id+'"]');
      const payload={termos:true};
      if(dEl){ if(!dEl.value){ alert("Informe a data que você fará o serviço."); return; } payload.data_servico=dEl.value; if(hEl&&hEl.value) payload.hora=hEl.value; }
      try{ await api("/api/tecnico/oportunidades/"+id+"/aceitar",{method:"POST",body:JSON.stringify(payload)}); carregarOportunidades(); }
      catch(e){ alert("Erro: "+e.message); }
    });
    document.querySelectorAll("[data-recusar]").forEach(b=>b.onclick=async()=>{
      const motivo=prompt("Motivo da recusa (opcional):",""); if(motivo===null) return;
      try{ await api("/api/tecnico/oportunidades/"+b.dataset.recusar+"/recusar",{method:"POST",body:JSON.stringify({motivo})}); carregarOportunidades(); }
      catch(e){ alert("Erro: "+e.message); }
    });
    document.querySelectorAll("[data-relatorio]").forEach(b=>b.onclick=()=>abrirRelatorio(b.dataset.relatorio));
  }catch(e){ $("abertas").innerHTML='<div class="vazio" style="color:var(--critico)">'+esc(e.message)+'</div>'; }
}
async function carregarRecebimentos(){
  try{
    const d=await api("/api/tecnico/recebimentos");
    let h='';
    if(!d.servicos.length) h='<div class="vazio" style="padding:8px 0">Nenhum recebimento previsto ainda.</div>';
    else {
      h=d.servicos.map(s=>'<div class="linha"><span>'+esc(s.titulo)+(s.is_retorno?' 🔁':'')+'<br><small style="color:var(--suave)">'+(s.pago?('✅ pago'):('previsão: '+(s.previsao_pagamento||"—")))+(s.meia_diaria?' · meia diária':'')+'</small></span><b style="color:'+(s.pago?'#176B42':'var(--tinta)')+'">'+brl(s.valor_cents)+'</b></div>').join("");
      h+='<div class="linha" style="border-top:2px solid var(--linha);font-weight:700"><span>Total em serviços</span><span>'+brl(d.total_servicos_cents)+'</span></div>';
      if(d.total_reembolsos_cents) h+='<div class="linha"><span>Reembolsos aprovados</span><b style="color:#176B42">'+brl(d.total_reembolsos_cents)+'</b></div>';
    }
    $("recebimentos").innerHTML=h;
  }catch(e){ $("recebimentos").innerHTML='<div class="vazio" style="color:var(--critico)">'+esc(e.message)+'</div>'; }
}

// ---- Relatório ----
let REL_FOTOS=[], REL_REEMB=[];
function abrirRelatorio(id){
  $("relOpId").value=id; $("relObs").value=""; $("relResolvido").checked=true; REL_FOTOS=[]; REL_REEMB=[];
  $("relFotos").value=""; $("relFotosPrev").innerHTML=""; $("relMsg").textContent=""; relRenderReemb();
  abrir("modalRel");
}
$("relCancelar").onclick=()=>fechar("modalRel");
$("relFotos").onchange=async()=>{
  const fs=$("relFotos").files; if(!fs||!fs.length) return;
  const fd=new FormData(); for(const f of fs) fd.append("fotos",f);
  $("relMsg").style.color="var(--suave)"; $("relMsg").textContent="Enviando fotos…";
  try{ const r=await fetch("/api/servicos/upload",{method:"POST",headers:{authorization:"Bearer "+token},body:fd}).then(x=>x.json());
    if(r.urls){ REL_FOTOS=REL_FOTOS.concat(r.urls).slice(0,8); $("relFotosPrev").innerHTML=REL_FOTOS.map(u=>'<img src="'+esc(u)+'">').join(""); $("relMsg").textContent=""; }
    else { $("relMsg").style.color="#B4232E"; $("relMsg").textContent=r.erro||"Falha."; }
  }catch(e){ $("relMsg").style.color="#B4232E"; $("relMsg").textContent="Falha no upload."; }
};
function relRenderReemb(){
  $("relReemb").innerHTML=REL_REEMB.map((r,i)=>'<div style="border:1px solid var(--linha);border-radius:9px;padding:8px 10px;margin-bottom:8px">'
    +'<div class="reemb-item"><input class="inp" placeholder="Produto/descrição" value="'+esc(r.descricao)+'" data-rd="'+i+'" style="flex:1"><input class="inp" type="number" min="0" step="0.01" placeholder="R$" value="'+(r.valor_cents?(r.valor_cents/100).toFixed(2):"")+'" data-rv="'+i+'" style="width:90px"><button type="button" class="btn btn-c btn-sm" data-rx="'+i+'">×</button></div>'
    +'<div style="display:flex;align-items:center;gap:8px;margin-top:6px">'
    +(r.comprovante_url?('<a href="'+esc(r.comprovante_url)+'" target="_blank"><img src="'+esc(r.comprovante_url)+'" style="width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--linha)"></a><span style="font-size:12px;color:#176B42">comprovante anexado</span>'):'<label style="font-size:12.5px;color:var(--agua-esc);cursor:pointer">📎 Anexar comprovante <input type="file" accept="image/*" data-rc="'+i+'" style="display:none"></label>')
    +'</div></div>').join("");
  $("relReemb").querySelectorAll("[data-rd]").forEach(el=>el.oninput=()=>{REL_REEMB[+el.dataset.rd].descricao=el.value;});
  $("relReemb").querySelectorAll("[data-rv]").forEach(el=>el.oninput=()=>{REL_REEMB[+el.dataset.rv].valor_cents=Math.round((parseFloat(el.value)||0)*100);});
  $("relReemb").querySelectorAll("[data-rx]").forEach(el=>el.onclick=()=>{REL_REEMB.splice(+el.dataset.rx,1);relRenderReemb();});
  $("relReemb").querySelectorAll("[data-rc]").forEach(el=>el.onchange=async()=>{
    const i=+el.dataset.rc; const f=el.files&&el.files[0]; if(!f) return;
    const fd=new FormData(); fd.append("fotos",f);
    try{ const r=await fetch("/api/servicos/upload",{method:"POST",headers:{authorization:"Bearer "+token},body:fd}).then(x=>x.json());
      if(r.urls&&r.urls[0]){ REL_REEMB[i].comprovante_url=r.urls[0]; relRenderReemb(); } }catch(e){ alert("Falha ao anexar."); }
  });
}
$("relAddReemb").onclick=()=>{ REL_REEMB.push({descricao:"",valor_cents:0}); relRenderReemb(); };
$("relEnviar").onclick=async()=>{
  const obs=$("relObs").value.trim(); if(!obs){ $("relMsg").style.color="#B4232E"; $("relMsg").textContent="Descreva o que foi feito."; return; }
  const b=$("relEnviar"); b.disabled=true;
  try{
    await api("/api/tecnico/oportunidades/"+$("relOpId").value+"/relatorio",{method:"POST",body:JSON.stringify({
      observacao:obs, resolvido:$("relResolvido").checked, fotos:REL_FOTOS,
      reembolsos:REL_REEMB.filter(r=>r.descricao&&r.valor_cents)})});
    fechar("modalRel"); carregarOportunidades();
  }catch(e){ $("relMsg").style.color="#B4232E"; $("relMsg").textContent=e.message; }
  finally{ b.disabled=false; }
};

carregarContrato(); carregarOportunidades(); carregarRecebimentos();
</script>
</body>
</html>
