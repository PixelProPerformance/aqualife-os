name: Marketplace Phase 1
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/marketplace/authorization.js
      - run: node --test tests/marketplace-authorization.test.mjs
