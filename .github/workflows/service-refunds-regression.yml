name: Service refunds regression
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: service_refunds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d service_refunds_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      SERVICOS_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/service_refunds_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check src/servicos.js
      - run: node --check public/js/admin.js
      - run: node --test tests/servicos-reembolsos-regressao.test.mjs tests/servicos-reembolsos-postgres.test.mjs
