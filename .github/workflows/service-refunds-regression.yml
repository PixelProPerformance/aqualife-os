name: Service refunds regression
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check src/servicos.js
      - run: node --check public/js/admin.js
      - run: node --test tests/servicos-reembolsos-regressao.test.mjs
