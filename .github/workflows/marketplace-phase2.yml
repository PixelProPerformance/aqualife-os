name: Marketplace Phase 2
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: marketplace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: node --test --test-concurrency=1 tests/*.test.mjs
        env:
          PG_TEST_URL: postgres://postgres:synthetic-ci-only@localhost:5432/marketplace_test
      - run: node --check src/server.js
      - run: node --check src/marketplace/onboarding.js
      - run: node --check public/js/marketplace.js
      - run: node --check public/js/marketplace-catalog.js
      - run: node --check src/marketplace/catalog.js
      - run: node --check src/marketplace/showcase.js
      - run: node --check public/js/marketplace-showcase.js
      - run: node --check public/js/marketplace-showcase-editor.js
